[package]
name = "moya-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "moya"
path = "src/main.rs"

[dependencies]
moya-core = { workspace = true }
moya-gpu = { workspace = true }
moya-pipeline = { workspace = true }
moya-io = { workspace = true }
moya-project = { workspace = true }
tempfile = { workspace = true }
eframe = { workspace = true, features = ["persistence"] }
image = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
tungstenite = "0.26"
sha2 = "0.10"
parking_lot = "0.12"
getrandom = "0.3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSURL"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication"] }
