[workspace]
resolver = "3"
members = [
    "crates/moya-core",
    "crates/moya-gpu",
    "crates/moya-pipeline",
    "crates/moya-io",
    "crates/moya-project",
    "crates/moya-app",
    "crates/moya-cli",
    "crates/moya-calib",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
publish = false

[workspace.dependencies]
moya-core = { path = "crates/moya-core" }
moya-gpu = { path = "crates/moya-gpu" }
moya-pipeline = { path = "crates/moya-pipeline" }
moya-io = { path = "crates/moya-io" }
moya-project = { path = "crates/moya-project" }
zip = { version = "6", default-features = false, features = ["deflate"] }
# MUST stay the exact wgpu major that eframe 0.37's egui-wgpu uses (check `cargo tree -i wgpu`).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
wgpu = "30"
image = { version = "0.25.10", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
