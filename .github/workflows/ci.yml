name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --release -- --nocapture
      # windows-latest has no GPU: wgpu runs on WARP (software D3D12). Many test devices
      # allocating multi-GB textures at once crash WARP natively (STATUS_ACCESS_VIOLATION);
      # the same tests pass single-threaded. The app itself uses one device.
      - name: Test (Windows, WARP)
        if: runner.os == 'Windows'
        run: cargo test --workspace --release -- --nocapture --test-threads=1
      # The real app through Open -> HQ render -> Send at 8/16/32-bit (ignored locally: GUI + fixed port).
      - name: Photoshop round trip (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p moya-app --release --test bridge_protocol -- --ignored --nocapture --test-threads=1
      - name: Check Photoshop plugin
        if: runner.os == 'macOS'
        run: node ps-plugin/check.cjs
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild
      - name: Silent install/uninstall smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem target/release-dist/Moya-*-windows-x64-setup.exe).FullName
          "Installer size: {0:N1} MiB" -f ((Get-Item $setup).Length / 1MB)
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Moya'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Moya.lnk'
          $data = Join-Path $env:APPDATA 'Moya'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'keep.txt') 'user data'
          function Run($exe, $argList) {
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exited $($p.ExitCode)" }
          }
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/MERGETASKS="!plugin"', "/LOG=$env:RUNNER_TEMP\install.log")
          foreach ($f in 'Moya.exe', 'Moya Photoshop Plugin.ccx', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing $f" }
          }
          if (-not (Test-Path $lnk)) { throw 'missing Start Menu shortcut' }
          $exe = Join-Path $app 'Moya.exe'
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\Moya.Project\shell\open\command').'(default)'
          if ($cmd -ne "`"$exe`" `"%1`"") { throw "bad open command: $cmd" }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.moya').'(default)' -ne 'Moya.Project') { throw 'bad .moya association' }
          $unkey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C3B1CCED-A737-4E2A-9674-1D865D79C8A4}_is1'
          $un = Get-ItemProperty -LiteralPath $unkey -ErrorAction SilentlyContinue
          if (-not $un) { throw 'missing uninstall entry' }
          $un | Format-List DisplayName, DisplayVersion, UninstallString
          Run (Join-Path $app 'unins000.exe') @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          for ($i = 0; (Test-Path $app) -and $i -lt 20; $i++) { Start-Sleep 1 }  # uninstaller deletes itself asynchronously
          if (Test-Path $app) { throw 'install dir remains' }
          if (Test-Path $lnk) { throw 'shortcut remains' }
          if (Test-Path 'HKCU:\Software\Classes\Moya.Project') { throw 'Moya.Project key remains' }
          if (Test-Path 'HKCU:\Software\Classes\.moya') { throw '.moya key remains' }
          if (Test-Path -LiteralPath $unkey) { throw 'uninstall entry remains' }
          if ((Get-Content (Join-Path $data 'keep.txt')) -ne 'user data') { throw 'user data touched' }
      - name: Upgrade over a running Moya with a hanging plugin installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem target/release-dist/Moya-*-windows-x64-setup.exe).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Moya'
          function Run($exe, $argList) {
            $p = Start-Process $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exited $($p.ExitCode)" }
          }
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/MERGETASKS="!plugin"')
          $moya = Start-Process (Join-Path $app 'Moya.exe') -PassThru
          Start-Sleep 5
          # Stand-in for Adobe's plugin installer that never exits: cmd.exe waits for console input.
          $upiDir = Join-Path ${env:CommonProgramFiles} 'Adobe\Adobe Desktop Common\RemoteComponents\UPI\UnifiedPluginInstallerAgent'
          New-Item -ItemType Directory -Force $upiDir | Out-Null
          Copy-Item "$env:WINDIR\System32\cmd.exe" (Join-Path $upiDir 'UnifiedPluginInstallerAgent.exe')
          $started = Get-Date
          # Setup remembers the first install's tasks (plugin off), so select it explicitly.
          Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/MERGETASKS="plugin"', "/LOG=$env:RUNNER_TEMP\upgrade.log")
          "Upgrade took {0:N0} s" -f ((Get-Date) - $started).TotalSeconds
          if (-not $moya.HasExited) { throw 'running Moya was not closed by the upgrade' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\upgrade.log" -Pattern 'Plugin installer exit code: 124' -Quiet)) {
            Get-Content "$env:RUNNER_TEMP\upgrade.log" -Tail 40; throw 'hanging plugin installer was not timed out'
          }
          if (-not (Test-Path (Join-Path $app 'Moya.exe'))) { throw 'Moya.exe missing after upgrade' }
          Get-Process UnifiedPluginInstallerAgent -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force (Join-Path ${env:CommonProgramFiles} 'Adobe')
          Run (Join-Path $app 'unins000.exe') @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
